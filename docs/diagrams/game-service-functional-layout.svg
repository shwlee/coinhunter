<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1610" viewBox="0 0 1500 1610" role="img" aria-labelledby="title description"><title id="title">서비스별 기능 배치와 실행 형태</title><desc id="description">FE, C# 운영 BE, 독립 상주 실행 관리자, 게임별 Node.js 엔진, 참가자별 알고리즘 프로세스와 독립 수집 모듈의 내부 기능을 표시한 목표 차트. 호스트나 컨테이너 배포 단위는 지정하지 않음.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs><style>text{font-family:'Malgun Gothic','Segoe UI',sans-serif;fill:#183047}.heading{font-size:28px;font-weight:700}.service-title{font-size:23px;font-weight:700}.form{font-size:16px;font-weight:700;fill:#245780}.module-title{font-size:19px;font-weight:700}.small{font-size:15px;fill:#425e73}.edge-label{font-size:15px;paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round}.edge{fill:none;stroke:#47749b;stroke-width:2;marker-start:url(#arrow);marker-end:url(#arrow)}.log{stroke:#a66b19;stroke-dasharray:8 5}</style><rect width="1500" height="1610" fill="white"/><text x="40" y="42" class="heading" text-anchor="start">서비스별 기능 배치 · 실행 형태와 내부 모듈</text><text x="40" y="72" class="small" text-anchor="start">목표 설계 · 큰 박스: 실행 구성 요소 · 내부 박스: 기능 모듈 · 호스트/컨테이너 단위는 지정하지 않음</text><rect x="40" y="120" width="660" height="350" rx="16" fill="#edf5fd" stroke="#a8bfd2" stroke-width="2"/><text x="62" y="156" class="service-title" text-anchor="start">01 · FE 서비스</text><rect x="60" y="172" width="620" height="34" rx="8" fill="#fff" fill-opacity=".8"/><text x="72" y="196" class="form" text-anchor="start">상주 웹서버 프로세스</text><rect x="60" y="228" width="302" height="78" rx="9" fill="#fff" stroke="#d1dde7"/><text x="74" y="257" class="module-title" text-anchor="start">페이지·에셋 제공</text><text x="74" y="284" class="small" text-anchor="start">HTML·JS·CSS·이미지·영상</text><rect x="378" y="228" width="302" height="78" rx="9" fill="#fff" stroke="#d1dde7"/><text x="392" y="257" class="module-title" text-anchor="start">API·파일·SSE 중계</text><text x="392" y="284" class="small" text-anchor="start">브라우저 ↔ 운영 BE</text><rect x="60" y="324" width="302" height="78" rx="9" fill="#fff" stroke="#d1dde7"/><text x="74" y="353" class="module-title" text-anchor="start">페이지 접근 UX</text><text x="74" y="380" class="small" text-anchor="start">로그인 이동·관리자 접근 표시</text><rect x="378" y="324" width="302" height="78" rx="9" fill="#fff" stroke="#d1dde7"/><text x="392" y="353" class="module-title" text-anchor="start">화면 보안·캐시</text><text x="392" y="380" class="small" text-anchor="start">CSP nonce·버전/캐시 정책</text><text x="62" y="447" class="small" text-anchor="start">브라우저는 FE 공개 주소로 접속 · 경기/계정 데이터는 보관하지 않음</text><rect x="800" y="120" width="660" height="350" rx="16" fill="#edf5fd" stroke="#a8bfd2" stroke-width="2"/><text x="822" y="156" class="service-title" text-anchor="start">02 · 게임 운영 서비스</text><rect x="820" y="172" width="620" height="34" rx="8" fill="#fff" fill-opacity=".8"/><text x="832" y="196" class="form" text-anchor="start">C# / ASP.NET Core · 상주 API 프로세스</text><rect x="820" y="228" width="302" height="78" rx="9" fill="#fff" stroke="#d1dde7"/><text x="834" y="257" class="module-title" text-anchor="start">계정·Google 인증·권한</text><text x="834" y="284" class="small" text-anchor="start">내부 ID·역할·소유권 검사</text><rect x="1138" y="228" width="302" height="78" rx="9" fill="#fff" stroke="#d1dde7"/><text x="1152" y="257" class="module-title" text-anchor="start">알고리즘 관리</text><text x="1152" y="284" class="small" text-anchor="start">원문 파일 참조·버전·저장/조회</text><rect x="820" y="324" width="302" height="78" rx="9" fill="#fff" stroke="#d1dde7"/><text x="834" y="353" class="module-title" text-anchor="start">맵·옵션·관리자</text><text x="834" y="380" class="small" text-anchor="start">초안/게시·사용자 관리</text><rect x="1138" y="324" width="302" height="78" rx="9" fill="#fff" stroke="#d1dde7"/><text x="1152" y="353" class="module-title" text-anchor="start">경기 요청·결과 조회</text><text x="1152" y="380" class="small" text-anchor="start">고정 요청·인가·요약 멱등 반영</text><text x="822" y="447" class="small" text-anchor="start">운영 저장 어댑터 → 운영 DB / 코드 파일 · 턴별 원본 로그와 분리</text><rect x="40" y="570" width="660" height="350" rx="16" fill="#edf5fd" stroke="#a8bfd2" stroke-width="2"/><text x="62" y="606" class="service-title" text-anchor="start">03 · 게임 실행 관리 서비스</text><rect x="60" y="622" width="620" height="34" rx="8" fill="#fff" fill-opacity=".8"/><text x="72" y="646" class="form" text-anchor="start">독립 상주 내부 서비스/프로세스 권장 · C# 구현 가능</text><rect x="60" y="678" width="302" height="78" rx="9" fill="#fff" stroke="#d1dde7"/><text x="74" y="707" class="module-title" text-anchor="start">실행 수락·자원 확인</text><text x="74" y="734" class="small" text-anchor="start">동시 경기·준비 작업 한도</text><rect x="378" y="678" width="302" height="78" rx="9" fill="#fff" stroke="#d1dde7"/><text x="392" y="707" class="module-title" text-anchor="start">게임 엔진 생성·준비</text><text x="392" y="734" class="small" text-anchor="start">경기 ID·고정 설정·ready 확인</text><rect x="60" y="774" width="302" height="78" rx="9" fill="#fff" stroke="#d1dde7"/><text x="74" y="803" class="module-title" text-anchor="start">감시·중단·정리</text><text x="74" y="830" class="small" text-anchor="start">장애·남은 실행기·임시 자원</text><rect x="378" y="774" width="302" height="78" rx="9" fill="#fff" stroke="#d1dde7"/><text x="392" y="803" class="module-title" text-anchor="start">상태·결과 중계</text><text x="392" y="830" class="small" text-anchor="start">화면 상태·완결 확인·미전달 대조</text><text x="62" y="897" class="small" text-anchor="start">엔진과 별도 프로세스 · 이동/점수/아이템 규칙을 직접 판정하지 않음</text><rect x="800" y="570" width="660" height="350" rx="16" fill="#eaf7f5" stroke="#a8bfd2" stroke-width="2"/><text x="822" y="606" class="service-title" text-anchor="start">04 · 게임 엔진</text><rect x="820" y="622" width="620" height="34" rx="8" fill="#fff" fill-opacity=".8"/><text x="832" y="646" class="form" text-anchor="start">게임마다 Node.js 프로세스 생성 · 준비부터 종료까지 유지</text><rect x="820" y="678" width="302" height="78" rx="9" fill="#fff" stroke="#d1dde7"/><text x="834" y="707" class="module-title" text-anchor="start">맵·플레이어·독립 턴</text><text x="834" y="734" class="small" text-anchor="start">경기 상태와 서버 경과 시간</text><rect x="1138" y="678" width="302" height="78" rx="9" fill="#fff" stroke="#d1dde7"/><text x="1152" y="707" class="module-title" text-anchor="start">액션·기믹·점수 판정</text><text x="1152" y="734" class="small" text-anchor="start">이동·충돌·획득·Hurry Up</text><rect x="820" y="774" width="302" height="78" rx="9" fill="#fff" stroke="#d1dde7"/><text x="834" y="803" class="module-title" text-anchor="start">알고리즘 실행 인터페이스</text><text x="834" y="830" class="small" text-anchor="start">참가자별 실행기에 호출/결과 연결</text><rect x="1138" y="774" width="302" height="78" rx="9" fill="#fff" stroke="#d1dde7"/><text x="1152" y="803" class="module-title" text-anchor="start">화면 상태·원본 이벤트</text><text x="1152" y="830" class="small" text-anchor="start">SSE용 상태 / 전량 기록 DTO 생산</text><text x="822" y="897" class="small" text-anchor="start">경기 A/B는 별도 프로세스 · 경기 종료/실행 장애 때 정리</text><rect x="40" y="1030" width="660" height="350" rx="16" fill="#fff5df" stroke="#a8bfd2" stroke-width="2"/><text x="62" y="1066" class="service-title" text-anchor="start">05 · 로그 수집 계층</text><rect x="60" y="1082" width="620" height="34" rx="8" fill="#fff" fill-opacity=".8"/><text x="72" y="1106" class="form" text-anchor="start">독립 공통 모듈 + 저장 어댑터 · 실행 호스트/서비스 배치 미정</text><rect x="60" y="1138" width="302" height="78" rx="9" fill="#fff" stroke="#d1dde7"/><text x="74" y="1167" class="module-title" text-anchor="start">수집 세션·순서·큐</text><text x="74" y="1194" class="small" text-anchor="start">경기별 seq·중복·바이트 한도</text><rect x="378" y="1138" width="302" height="78" rx="9" fill="#fff" stroke="#d1dde7"/><text x="392" y="1167" class="module-title" text-anchor="start">내구 확인·오류 통지</text><text x="392" y="1194" class="small" text-anchor="start">큐 접수와 내구 저장 확인 구분</text><rect x="60" y="1234" width="302" height="78" rx="9" fill="#fff" stroke="#d1dde7"/><text x="74" y="1263" class="module-title" text-anchor="start">완결·복구·기록 목록</text><text x="74" y="1290" class="small" text-anchor="start">끝난 기록·부분 기록·위치/상태</text><rect x="378" y="1234" width="302" height="78" rx="9" fill="#fff" stroke="#d1dde7"/><text x="392" y="1263" class="module-title" text-anchor="start">저장·조회·보관 어댑터</text><text x="392" y="1290" class="small" text-anchor="start">스트리밍·소유 범위·삭제·아카이브</text><text x="62" y="1357" class="small" text-anchor="start">별도 수집 서비스 또는 전용 worker 등은 추후 결정 · 엔진은 인터페이스 의존</text><rect x="800" y="1030" width="660" height="350" rx="16" fill="#f3effc" stroke="#a8bfd2" stroke-width="2"/><text x="822" y="1066" class="service-title" text-anchor="start">06 · 언어별 알고리즘 실행기</text><rect x="820" y="1082" width="620" height="34" rx="8" fill="#fff" fill-opacity=".8"/><text x="832" y="1106" class="form" text-anchor="start">경기/참가자마다 별도 프로세스 · 경기 동안 인스턴스 유지</text><rect x="820" y="1138" width="302" height="78" rx="9" fill="#fff" stroke="#d1dde7"/><text x="834" y="1167" class="module-title" text-anchor="start">언어별 준비·로드</text><text x="834" y="1194" class="small" text-anchor="start">현재 JS/QuickJS · 다른 언어 미구현</text><rect x="1138" y="1138" width="302" height="78" rx="9" fill="#fff" stroke="#d1dde7"/><text x="1152" y="1167" class="module-title" text-anchor="start">플레이어 인스턴스</text><text x="1152" y="1194" class="small" text-anchor="start">initialize·getName·moveNext</text><rect x="820" y="1234" width="302" height="78" rx="9" fill="#fff" stroke="#d1dde7"/><text x="834" y="1263" class="module-title" text-anchor="start">호출별 실행 제어</text><text x="834" y="1290" class="small" text-anchor="start">500ms 초과는 해당 호출만 중단</text><rect x="1138" y="1234" width="302" height="78" rx="9" fill="#fff" stroke="#d1dde7"/><text x="1152" y="1263" class="module-title" text-anchor="start">결과·출력 정규화</text><text x="1152" y="1290" class="small" text-anchor="start">방향·상태·시간·제한된 debug</text><text x="822" y="1357" class="small" text-anchor="start">턴마다 재컴파일/프로세스 재생성하지 않음 · 운영 DB에 직접 접속하지 않음</text><path d="M 700 285 H 800" class="edge "/><text x="750" y="268" class="edge-label" text-anchor="middle">API/SSE</text><path d="M 1130 470 V 520 H 370 V 570" class="edge "/><text x="750" y="505" class="edge-label" text-anchor="middle">실행 요청 / 상태·결과</text><path d="M 700 745 H 800" class="edge "/><text x="750" y="726" class="edge-label" text-anchor="middle">관리/상태</text><path d="M 1130 920 V 1030" class="edge "/><text x="1130" y="972" class="edge-label" text-anchor="middle">공통 호출 / 정규화 결과</text><path d="M 800 860 H 750 V 980 H 370 V 1030" class="edge log"/><text x="610" y="963" class="edge-label" text-anchor="middle">전량 이벤트 · 확인/오류 계약</text><rect x="40" y="1440" width="1420" height="135" rx="12" fill="#f2f5f8"/><text x="62" y="1475" class="module-title" text-anchor="start">저장 영역은 서비스 내부 모듈과 구분</text><text x="62" y="1510" class="small" text-anchor="start">운영 BE의 저장 어댑터 → 운영 DB(업무 메타데이터·맵·결과 요약) / 알고리즘 원문·경기 사본 파일</text><text x="62" y="1540" class="small" text-anchor="start">수집 계층의 저장 어댑터 → 실행 저널·실행 기록 목록 / 선택적 아카이브 · 구체 저장 구현은 교체 가능</text></svg>
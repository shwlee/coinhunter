<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="2942" viewBox="0 0 1560 2942" role="img" aria-labelledby="title description">
<title id="title">경기 실행과 화면 렌더링 시퀀스</title><desc id="description">일곱 구성 요소 사이의 페이지 요청, 경기 준비, SSE 구독, 독립 턴, 화면 보간, 종료와 로그 완결의 논리 순서. 현재 구현이 아닌 목표 흐름.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Malgun Gothic','Segoe UI',sans-serif;fill:#183047}.heading{font-size:27px;font-weight:700}.label{font-size:17px}.small{font-size:15px;fill:#4e6274}.node-title{font-size:21px;font-weight:700}.phase{font-size:19px;font-weight:700;fill:#245780}.edge-label{font-size:15px;paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round}.line{fill:none;stroke:#47749b;stroke-width:2;marker-end:url(#arrow)}.both{marker-start:url(#arrow)}.log{stroke:#a66b19;stroke-dasharray:8 5}.life{stroke:#bac7d2;stroke-width:1.5;stroke-dasharray:6 5}</style>
<rect width="1560" height="2942" fill="#fff"/><text x="30" y="38" class="heading" text-anchor="start">경기 요청에서 브라우저 렌더링·종료까지</text><text x="30" y="68" class="small" text-anchor="start">목표 시퀀스 · 실선: 요청/처리 · 점선: 상태/응답 · 갈색: 원본 로그 경로</text><line x1="110" y1="140" x2="110" y2="2917" class="life"/><line x1="330" y1="140" x2="330" y2="2917" class="life"/><line x1="550" y1="140" x2="550" y2="2917" class="life"/><line x1="770" y1="140" x2="770" y2="2917" class="life"/><line x1="990" y1="140" x2="990" y2="2917" class="life"/><line x1="1210" y1="140" x2="1210" y2="2917" class="life"/><line x1="1430" y1="140" x2="1430" y2="2917" class="life"/><rect x="17" y="90" width="186" height="50" rx="9" fill="#e9f2fa" stroke="#b8cbdc"/><text x="110" y="122" class="label" text-anchor="middle">브라우저</text><rect x="237" y="90" width="186" height="50" rx="9" fill="#e9f2fa" stroke="#b8cbdc"/><text x="330" y="122" class="label" text-anchor="middle">FE 웹서버</text><rect x="457" y="90" width="186" height="50" rx="9" fill="#e9f2fa" stroke="#b8cbdc"/><text x="550" y="122" class="label" text-anchor="middle">C# 운영 BE</text><rect x="677" y="90" width="186" height="50" rx="9" fill="#e9f2fa" stroke="#b8cbdc"/><text x="770" y="122" class="label" text-anchor="middle">실행 관리자</text><rect x="897" y="90" width="186" height="50" rx="9" fill="#e9f2fa" stroke="#b8cbdc"/><text x="990" y="122" class="label" text-anchor="middle">게임 엔진</text><rect x="1117" y="90" width="186" height="50" rx="9" fill="#e9f2fa" stroke="#b8cbdc"/><text x="1210" y="122" class="label" text-anchor="middle">참가자 실행기</text><rect x="1337" y="90" width="186" height="50" rx="9" fill="#fff0ce" stroke="#b8cbdc"/><text x="1430" y="122" class="label" text-anchor="middle">로그 수집</text><rect x="20" y="150" width="1520" height="43" rx="8" fill="#eaf1f8"/><text x="40" y="178" class="phase" text-anchor="start">1 · 페이지 로드와 경기 요청</text><path d="M 110 237 H 330" fill="none" stroke="#47749b" stroke-width="2"  marker-end="url(#arrow)"/><text x="220" y="227" class="edge-label" text-anchor="middle">페이지·에셋 요청</text><path d="M 330 295 H 110" fill="none" stroke="#47749b" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow)"/><text x="220" y="285" class="edge-label" text-anchor="middle">HTML·JS·CSS·이미지</text><path d="M 110 353 H 330" fill="none" stroke="#47749b" stroke-width="2"  marker-end="url(#arrow)"/><text x="220" y="343" class="edge-label" text-anchor="middle">경기 생성 요청</text><path d="M 330 411 H 550" fill="none" stroke="#47749b" stroke-width="2"  marker-end="url(#arrow)"/><text x="440" y="401" class="edge-label" text-anchor="middle">요청·쿠키 전달</text><path d="M 550 469 h 82 v 23 h -82" fill="none" stroke="#47749b" stroke-width="2" marker-end="url(#arrow)"/><text x="562" y="461" class="edge-label" text-anchor="start">인가·맵/코드 고정</text><path d="M 550 527 H 770" fill="none" stroke="#47749b" stroke-width="2"  marker-end="url(#arrow)"/><text x="660" y="517" class="edge-label" text-anchor="middle">경기 실행 요청</text><path d="M 770 585 H 990" fill="none" stroke="#47749b" stroke-width="2"  marker-end="url(#arrow)"/><text x="880" y="575" class="edge-label" text-anchor="middle">엔진 프로세스 생성</text><rect x="20" y="618" width="1520" height="43" rx="8" fill="#eaf1f8"/><text x="40" y="646" class="phase" text-anchor="start">2 · 코드 준비·초기 상태·시작 동기화</text><path d="M 990 705 H 1430" fill="none" stroke="#a66b19" stroke-width="2"  marker-end="url(#arrow)"/><text x="1210" y="695" class="edge-label" text-anchor="middle">기록 세션 열기·준비 이벤트</text><path d="M 990 763 H 1210" fill="none" stroke="#47749b" stroke-width="2"  marker-end="url(#arrow)"/><text x="1100" y="753" class="edge-label" text-anchor="middle">코드 준비·initialize/getName</text><path d="M 1210 821 H 990" fill="none" stroke="#47749b" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow)"/><text x="1100" y="811" class="edge-label" text-anchor="middle">준비 결과</text><path d="M 990 879 H 770" fill="none" stroke="#47749b" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow)"/><text x="880" y="869" class="edge-label" text-anchor="middle">ready·초기 상태</text><path d="M 770 937 H 550" fill="none" stroke="#47749b" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow)"/><text x="660" y="927" class="edge-label" text-anchor="middle">경기 ID·준비 상태</text><path d="M 550 995 H 330" fill="none" stroke="#47749b" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow)"/><text x="440" y="985" class="edge-label" text-anchor="middle">경기 생성 응답</text><path d="M 330 1053 H 110" fill="none" stroke="#47749b" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow)"/><text x="220" y="1043" class="edge-label" text-anchor="middle">경기 ID</text><path d="M 110 1111 H 330" fill="none" stroke="#47749b" stroke-width="2"  marker-end="url(#arrow)"/><text x="220" y="1101" class="edge-label" text-anchor="middle">경기 SSE 구독</text><path d="M 330 1169 H 550" fill="none" stroke="#47749b" stroke-width="2"  marker-end="url(#arrow)"/><text x="440" y="1159" class="edge-label" text-anchor="middle">세션·조회 권한 확인</text><path d="M 550 1227 H 770" fill="none" stroke="#47749b" stroke-width="2"  marker-end="url(#arrow)"/><text x="660" y="1217" class="edge-label" text-anchor="middle">상태 스트림 연결</text><path d="M 770 1285 H 550" fill="none" stroke="#47749b" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow)"/><text x="660" y="1275" class="edge-label" text-anchor="middle">최신 전체 상태·시작 기준</text><path d="M 550 1343 H 330" fill="none" stroke="#47749b" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow)"/><text x="440" y="1333" class="edge-label" text-anchor="middle">SSE 전달</text><path d="M 330 1401 H 110" fill="none" stroke="#47749b" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow)"/><text x="220" y="1391" class="edge-label" text-anchor="middle">초기 화면·카운트다운</text><rect x="30" y="1437" width="1500" height="38" rx="8" fill="#fff4d9"/><text x="780" y="1462" class="small" text-anchor="middle">ready 이후 시작 · 화면 자산 준비와 카운트다운/시작 표시를 서버 기준에 맞춤</text><rect x="20" y="1492" width="1520" height="43" rx="8" fill="#eaf1f8"/><text x="40" y="1520" class="phase" text-anchor="start">3 · 참가자별 독립 턴 반복 — 액션 시작과 완료는 서로 다른 시점</text><path d="M 990 1579 H 1210" fill="none" stroke="#47749b" stroke-width="2"  marker-end="url(#arrow)"/><text x="1100" y="1569" class="edge-label" text-anchor="middle">맵·위치·아이템 호출</text><path d="M 1210 1637 H 990" fill="none" stroke="#47749b" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow)"/><text x="1100" y="1627" class="edge-label" text-anchor="middle">방향·상태·시간·출력</text><path d="M 990 1695 h 82 v 23 h -82" fill="none" stroke="#47749b" stroke-width="2" marker-end="url(#arrow)"/><text x="1002" y="1687" class="edge-label" text-anchor="start">액션 종류·시작/종료 결정</text><path d="M 990 1753 H 770" fill="none" stroke="#47749b" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow)"/><text x="880" y="1743" class="edge-label" text-anchor="middle">현재 액션·화면 상태</text><path d="M 770 1811 H 550" fill="none" stroke="#47749b" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow)"/><text x="660" y="1801" class="edge-label" text-anchor="middle">상태 중계</text><path d="M 550 1869 H 330" fill="none" stroke="#47749b" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow)"/><text x="440" y="1859" class="edge-label" text-anchor="middle">SSE 전달</text><path d="M 330 1927 H 110" fill="none" stroke="#47749b" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow)"/><text x="220" y="1917" class="edge-label" text-anchor="middle">현재 액션·시간</text><path d="M 110 1985 h 82 v 23 h -82" fill="none" stroke="#47749b" stroke-width="2" marker-end="url(#arrow)"/><text x="122" y="1977" class="edge-label" text-anchor="start">프레임 보간·방향/이펙트</text><path d="M 990 2043 h 82 v 23 h -82" fill="none" stroke="#47749b" stroke-width="2" marker-end="url(#arrow)"/><text x="1002" y="2035" class="edge-label" text-anchor="start">액션 완료·점수/맵 확정</text><path d="M 990 2101 H 1430" fill="none" stroke="#a66b19" stroke-width="2"  marker-end="url(#arrow)"/><text x="1210" y="2091" class="edge-label" text-anchor="middle">전량 결과·실제 랜덤 결과</text><rect x="30" y="2137" width="1500" height="38" rx="8" fill="#fff4d9"/><text x="780" y="2162" class="small" text-anchor="middle">확정 점수/맵도 동일 경로로 전달 · 랜덤점프는 알고리즘 호출 생략 · 모든 참가자 공통 라운드 아님</text><rect x="20" y="2192" width="1520" height="43" rx="8" fill="#eaf1f8"/><text x="40" y="2220" class="phase" text-anchor="start">4 · 종료 화면·실행기 정리·기록 완결·결과 반영</text><path d="M 990 2279 H 770" fill="none" stroke="#47749b" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow)"/><text x="880" y="2269" class="edge-label" text-anchor="middle">최종 상태·새 턴 차단</text><path d="M 770 2337 H 550" fill="none" stroke="#47749b" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow)"/><text x="660" y="2327" class="edge-label" text-anchor="middle">경기 종료 상태</text><path d="M 550 2395 H 330" fill="none" stroke="#47749b" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow)"/><text x="440" y="2385" class="edge-label" text-anchor="middle">SSE 전달</text><path d="M 330 2453 H 110" fill="none" stroke="#47749b" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow)"/><text x="220" y="2443" class="edge-label" text-anchor="middle">게임오버 → 포디엄</text><path d="M 990 2511 H 1210" fill="none" stroke="#47749b" stroke-width="2"  marker-end="url(#arrow)"/><text x="1100" y="2501" class="edge-label" text-anchor="middle">남은 호출 정리·실행기 종료</text><path d="M 990 2569 H 1430" fill="none" stroke="#a66b19" stroke-width="2"  marker-end="url(#arrow)"/><text x="1210" y="2559" class="edge-label" text-anchor="middle">최종 이벤트·완결 요청</text><path d="M 1430 2627 H 770" fill="none" stroke="#a66b19" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow)"/><text x="1100" y="2617" class="edge-label" text-anchor="middle">내구/완결 receipt 또는 실패</text><path d="M 770 2685 H 550" fill="none" stroke="#47749b" stroke-width="2"  marker-end="url(#arrow)"/><text x="660" y="2675" class="edge-label
name: Verify
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:editor
      - run: npm run format:check
      - run: npm test
      - run: npm run verify:runtime
      - run: npm run demo
  backend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - run: npm ci
      - if: runner.os == 'Windows'
        run: npm run backend:test
      # Isolated CI VM only: production needs a delegated subtree and a restricted
      # service identity, not a root-run service. Do not weaken permissions at the mount root.
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          root="/sys/fs/cgroup/coinhunter-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo sh -c 'printf "+memory +cpu +pids" > /sys/fs/cgroup/cgroup.subtree_control'
          sudo mkdir "$root"
          sudo sh -c 'printf "+memory +cpu +pids" > "$1/cgroup.subtree_control"' sh "$root"
          sudo env "PATH=$PATH" "DOTNET_ROOT=$DOTNET_ROOT" "Backend__Resources__CgroupRoot=$root" node scripts/backend.js test

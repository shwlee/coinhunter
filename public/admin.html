<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>관리자 페이지 · Coin Hunter</title>
    <link rel="icon" type="image/svg+xml" href="/coin-hunter-icon.svg" />
    <link rel="stylesheet" href="/entry.css" />
    <script type="module" src="/admin.js"></script>
  </head>
  <body data-page="admin">
    <header>
      <a class="brand" href="/"><img src="/coin-hunter-icon.svg" alt="" />COIN HUNTER</a>
      <div id="account-bar"></div>
    </header>
    <main class="admin-main">
      <a class="back-link" href="/">← 홈으로</a>
      <p class="eyebrow">GAME ADMINISTRATION</p>
      <h1>관리자 페이지</h1>
      <p class="intro">사용자와 게임 설정, 플레이 맵을 관리합니다.</p>
      <div class="admin-sections" aria-label="관리 영역">
        <section class="admin-panel">
          <span class="admin-panel-symbol" aria-hidden="true">♙</span>
          <h2>사용자 관리</h2>
          <p>계정의 이용 상태와 관리자 권한을 관리합니다.</p>
          <a href="#user-management">사용자 관리하기 →</a>
        </section>
        <section class="admin-panel">
          <span class="admin-panel-symbol" aria-hidden="true">⚙</span>
          <h2>게임 옵션</h2>
          <p>경기 시간과 아이템·기믹 설정을 관리합니다.</p>
        </section>
        <section class="admin-panel">
          <span class="admin-panel-symbol" aria-hidden="true">▦</span>
          <h2>게임맵</h2>
          <p>빈 게임판에 코인과 벽을 배치하고 저장합니다.</p>
          <a href="/admin/maps">맵 관리하기 →</a>
        </section>
      </div>
      <section id="user-management" class="user-management" aria-labelledby="users-title" hidden>
        <div class="users-heading">
          <div>
            <h2 id="users-title">사용자 관리</h2>
            <p id="user-count"></p>
          </div>
          <button id="refresh-users" type="button">새로고침</button>
        </div>
        <div class="user-filters">
          <label>계정 검색<input id="user-search" type="search" placeholder="이메일 검색" /></label>
          <label
            >권한<select id="role-filter">
              <option value="all">전체</option>
              <option value="admin">관리자</option>
              <option value="user">일반 사용자</option>
            </select></label
          >
          <label
            >이용 상태<select id="active-filter">
              <option value="all">전체</option>
              <option value="active">이용 가능</option>
              <option value="inactive">이용 중지</option>
            </select></label
          >
        </div>
        <p id="user-feedback" role="status" aria-live="polite"></p>
        <div id="users" role="list" aria-label="계정 목록"></div>
        <p id="users-empty" hidden>조건에 맞는 계정이 없습니다.</p>
      </section>
      <p id="entry-status" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>

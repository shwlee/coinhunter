<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>관리자 페이지 · Coin Hunter</title>
    <link rel="icon" type="image/svg+xml" href="/coin-hunter-icon.svg" />
    <link rel="stylesheet" href="/entry.css" />
    <script type="module" src="/entry.js"></script>
  </head>
  <body data-page="admin">
    <header>
      <a class="brand" href="/"><img src="/coin-hunter-icon.svg" alt="" />COIN HUNTER</a>
      <div id="account-bar"></div>
    </header>
    <main class="admin-main">
      <a class="back-link" href="/">← 홈으로</a>
      <p class="eyebrow">GAME ADMINISTRATION</p>
      <h1>관리자 페이지</h1>
      <p class="intro">사용자와 게임 설정, 플레이 맵을 관리합니다.</p>
      <div class="admin-sections" aria-label="관리 영역">
        <section class="admin-panel">
          <span class="admin-panel-symbol" aria-hidden="true">♙</span>
          <h2>사용자 관리</h2>
          <p>계정의 이용 상태와 관리자 권한을 관리합니다.</p>
        </section>
        <section class="admin-panel">
          <span class="admin-panel-symbol" aria-hidden="true">⚙</span>
          <h2>게임 옵션</h2>
          <p>경기 시간과 아이템·기믹 설정을 관리합니다.</p>
        </section>
        <section class="admin-panel">
          <span class="admin-panel-symbol" aria-hidden="true">▦</span>
          <h2>게임맵</h2>
          <p>대칭 맵을 만들고 편집하여 게시합니다.</p>
        </section>
      </div>
      <p id="entry-status" role="status"></p>
    </main>
  </body>
</html>
